<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>edid 的生日倒计时</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --trans-blue:#5BCEFA;
  --trans-pink:#F5A9B8;
  --trans-white:#FFFFFF;
  --bg-light:rgba(255,255,255,0.15);
  --bg-dark:rgba(0,0,0,0.45);
  --text-light:#ffffff;
  --text-dark:#eaeaea;
}
@media (prefers-color-scheme: dark){
  :root{
    --card-bg:var(--bg-dark);
    --text:var(--text-dark);
  }
}
@media (prefers-color-scheme: light){
  :root{
    --card-bg:var(--bg-light);
    --text:var(--text-light);
  }
}
html,body{height:100%;margin:0;font-family:'Poppins',system-ui;color:var(--text)}
body{
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  display:flex;align-items:center;justify-content:center;
}
body::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.6));
}
.card{
  position:relative;z-index:1;
  max-width:820px;width:92%;
  padding:28px;border-radius:18px;
  background:var(--card-bg);
  backdrop-filter:blur(8px);
  box-shadow:0 12px 30px rgba(0,0,0,.5);
  text-align:center;
}
.avatar{
  width:96px;height:96px;border-radius:50%;
  object-fit:cover;
  border:4px solid transparent;
  background:
    linear-gradient(#000,#000) padding-box,
    linear-gradient(90deg,var(--trans-blue),var(--trans-white),var(--trans-pink)) border-box;
  margin:-76px auto 12px;
}
.title{font-size:2rem;font-weight:800}
.subtitle{opacity:.9;margin-bottom:14px}
.countdown{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.unit{min-width:90px;padding:12px;border-radius:12px;background:rgba(255,255,255,.08)}
.number{font-size:1.6rem;font-weight:700}
.stripe{margin:16px auto;height:10px;width:220px;border-radius:999px;
  background:linear-gradient(90deg,var(--trans-blue),var(--trans-white),var(--trans-pink))}
.greeting{font-size:1.8rem;font-weight:800}
footer{font-size:.8rem;opacity:.85;margin-top:10px}
select{border-radius:8px;padding:4px}
</style>
</head>
<body>
<main class="card">
<img id="avatar" class="avatar" src="./edid.jpg" alt="edid avatar" onerror="this.onerror=null;this.src='https://avatars.githubusercontent.com/u/9919?s=200'">
<div class="title">给 edid 的倒计时</div>
<div class="subtitle">1 月 16 日 · 每天一张壁纸</div>

<div>
  壁纸来源：
  <select id="source">
    <option value="wt">War Thunder</option>
    <option value="bing">Bing</option>
  </select>
</div>

<div id="countdown-area">
  <div class="countdown">
    <div class="unit"><div class="number" id="days">--</div>天</div>
    <div class="unit"><div class="number" id="hours">--</div>小时</div>
    <div class="unit"><div class="number" id="minutes">--</div>分钟</div>
    <div class="unit"><div class="number" id="seconds">--</div>秒</div>
  </div>
</div>

<div id="greeting-area" style="display:none">
  <div class="greeting">生日快乐，edid！</div>
</div>

<div class="stripe"></div>
<div id="quote" class="subtitle"></div>
<footer>深色模式自动跟随系统</footer>
</main>

<script>
const PERSON_NAME='edid', BIRTH_MONTH=1, BIRTH_DAY=16;

// ===== 每日一言（本地示例，可自行扩展） =====
const QUOTES=[
  '愿今天的你，比昨天多一点温柔。',
  '世界很吵，记得抱紧自己。',
  '慢一点，也是在前进。',
  '你本来就值得被认真对待。'
];

function dailyPick(arr){
  const d=new Date().toISOString().slice(0,10);
  let h=0; for(const c of d) h+=c.charCodeAt(0);
  return arr[h%arr.length];
}
document.getElementById('quote').textContent=dailyPick(QUOTES);

// ===== 背景：每天一张 =====
const WT=[
 'https://warthunder.com/upload/image/media/wallpapers/tank_1920.jpg',
 'https://warthunder.com/upload/image/media/wallpapers/aircraft_1920.jpg',
 'https://warthunder.com/upload/image/media/wallpapers/ship_1920.jpg'
];

function setBackground(){
  const src=document.getElementById('source').value;
  const today=new Date().toISOString().slice(0,10);
  let idx=[...today].reduce((a,c)=>a+c.charCodeAt(0),0);
  if(src==='wt'){
    document.body.style.backgroundImage=`url('${WT[idx%WT.length]}')`;
  }else{
    document.body.style.backgroundImage=`url('https://www.bing.com/th?id=OHR.${today.replace(/-/g,'')}')`;
  }
}
document.getElementById('source').onchange=setBackground;
setBackground();

// ===== 倒计时 =====
const countdownArea=document.getElementById('countdown-area');
const greetingArea=document.getElementById('greeting-area');
const daysEl=document.getElementById('days');
const hoursEl=document.getElementById('hours');
const minutesEl=document.getElementById('minutes');
const secondsEl=document.getElementById('seconds');

function update(){
  const now=new Date();
  const todayIsBirthday=(now.getMonth()==BIRTH_MONTH-1 && now.getDate()==BIRTH_DAY);
  let next=new Date(now.getFullYear(),BIRTH_MONTH-1,BIRTH_DAY);
  if(next<now) next.setFullYear(next.getFullYear()+1);

  if(todayIsBirthday){
    countdownArea.style.display='none';
    greetingArea.style.display='block';
    return;
  }
  countdownArea.style.display='block';
  greetingArea.style.display='none';
  const diff=next-now;
  daysEl.textContent=Math.floor(diff/86400000);
  hoursEl.textContent=Math.floor(diff/3600000)%24;
  minutesEl.textContent=Math.floor(diff/60000)%60;
  secondsEl.textContent=Math.floor(diff/1000)%60;
}
update(); setInterval(update,1000);
</script>
</body>
</html>
